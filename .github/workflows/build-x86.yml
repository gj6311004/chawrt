# chawrt x86 构建 v8 —— 官方 main + x86.config + 三处上游修补
#
# 失败史（每次都在往后推进）：
#   v1/v2  25.12 自拼配置 → aw-bpf 源码仓库 404
#   v3     swap 撞 runner 预置 /swapfile
#   v4     113 分钟 → swanmon 缺 libglib-2.0.so.0 提供者
#   v5     download 卡 44 分钟（无总超时）
#   v6     184 分钟 → xfrpc PKG_VERSION=4.04.855 不存在（真实 tag 5.09.982/5.06.909/3.05.661）
#   v7     152 分钟 → xfrpc 已编过，但打包缺 libwolfssl
#            Package xfrpc is missing dependencies for the following libraries:
#            libwolfssl.so.5.9.0.e624513f
#   v8     给 xfrpc 补 +libwolfssl（xfrpc 5.x 的 CMake 默认 USE_WOLFSSL=ON）
#
name: build chawrt x86 (official)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '源码分支'
        required: true
        default: 'main'
        type: string
      config:
        description: '使用仓库内哪份 .config'
        required: true
        default: 'x86.config'
        type: choice
        options: ['x86.config', 'r2s.config', '360t7.config', 'ea0326gmp.config', 'jcg.config', 'micr6608.config']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 腾磁盘 + swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          if ! sudo swapon --show 2>/dev/null | grep -q '/swapfile'; then
            sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 2>/dev/null || true
            sudo chmod 600 /swapfile 2>/dev/null || true
            sudo mkswap /swapfile >/dev/null 2>&1 || true
            sudo swapon /swapfile 2>/dev/null || true
          fi
          df -h /
          free -h
          exit 0

      - name: 装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time libelf-dev

      - name: 克隆 chawrt
        run: |
          git clone --depth 1 -b "${{ inputs.ref }}" https://github.com/liudf0716/chawrt.git chawrt
          cd chawrt
          echo "HEAD: $(git log -1 --format='%h %s')"

      - name: feeds
        run: |
          cd chawrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 修补上游包源
        run: |
          cd chawrt

          echo "########## 1) swanmon: 补 glib2-core ##########"
          f=feeds/packages/utils/swanmon/Makefile
          sed -i 's/DEPENDS:=+davici +glib2 +libjson-c/DEPENDS:=+davici +glib2-core +glib2 +libjson-c/' "$f"
          grep -q 'glib2-core' "$f" || sed -i 's/+glib2 /+glib2-core +glib2 /' "$f"
          grep -n 'DEPENDS' "$f" || true
          grep -q 'glib2-core' "$f" || { echo "::error::swanmon 补丁失败"; exit 1; }

          echo "########## 2) xfrpc: 版本 4.04.855 -> 5.09.982 ##########"
          x=feeds/packages/net/xfrpc/Makefile
          echo "--- 原始 ---"
          grep -E 'PKG_VERSION|PKG_HASH|DEPENDS' "$x" || true
          ver=5.09.982
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$ver/" "$x"
          mkdir -p dl
          if [ ! -s "dl/xfrpc-$ver.tar.gz" ]; then
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 300 \
              "https://codeload.github.com/liudf0716/xfrpc/tar.gz/$ver" -o "dl/xfrpc-$ver.tar.gz" || true
          fi
          [ -s "dl/xfrpc-$ver.tar.gz" ] || { echo "::error::xfrpc $ver 下载失败"; exit 1; }
          h=$(sha256sum "dl/xfrpc-$ver.tar.gz" | awk '{print $1}')
          sed -i "s|^PKG_HASH:=.*|PKG_HASH:=$h|" "$x"

          echo "########## 3) xfrpc: 补 libwolfssl 依赖 ##########"
          sed -i 's|+libevent2-openssl|+libevent2-openssl +libwolfssl|' "$x"
          echo "--- 修补后 ---"
          grep -E 'PKG_VERSION|PKG_HASH|DEPENDS' "$x" || true
          grep -q 'libwolfssl' "$x" || { echo "::error::xfrpc libwolfssl 补丁失败"; exit 1; }
          ls -lh "dl/xfrpc-$ver.tar.gz"

      - name: 应用官方配置
        run: |
          cd chawrt
          cp "${{ inputs.config }}" .config
          make defconfig
          echo "==== target ===="
          grep -E '^CONFIG_TARGET_PROFILE|^CONFIG_TARGET_x86_64_DEVICE' .config || true
          echo "==== 关键包 ===="
          grep -E '^CONFIG_PACKAGE_(apfree-wifidog|xfrpc|strongswan|swanmon|bpfilter|libwolfssl|glib2)=' .config || true
          echo "==== 选中包数 ===="
          grep -c '^CONFIG_PACKAGE_.*=y$' .config || true

      - name: 下载源码（限时 15 分钟）
        continue-on-error: true
        run: |
          set -o pipefail
          cd chawrt
          timeout --signal=INT --kill-after=30 900 make download -j8 2>&1 | tee download.log | tail -n 40 || true
          du -sh dl 2>/dev/null || true
          ls dl 2>/dev/null | wc -l || true
          if [ "$(ls dl 2>/dev/null | wc -l)" -lt 50 ]; then
            timeout --signal=INT --kill-after=30 600 make download -j4 2>&1 | tail -n 40 || true
          fi
          exit 0

      - name: 编译
        run: |
          set -o pipefail
          cd chawrt
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: 编译失败定位
        if: failure()
        run: |
          cd chawrt || exit 0
          make -j1 V=s 2>&1 | tee build-single.log | tail -n 300 || true

      - name: 错误摘要
        if: failure()
        run: |
          [ -d chawrt ] || { echo "chawrt 目录不存在"; exit 0; }
          cd chawrt
          for f in build.log build-single.log download.log; do
            [ -f "$f" ] || continue
            echo "===== $f errors ====="
            grep -nE 'make\[[0-9]+\]: \*\*\*|Error [0-9]+$|Killed|No space left|fatal error|ERROR:|missing dependencies|404' "$f" | tail -n 50 || true
            echo "===== $f tail 80 ====="
            tail -n 80 "$f" || true
          done
          df -h /

      - name: 上传诊断
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: diag-chawrt-x86
          path: |
            chawrt/build.log
            chawrt/build-single.log
            chawrt/download.log
            chawrt/.config
            chawrt/logs/**
          if-no-files-found: warn
          retention-days: 7

      - name: 产物清单
        if: success()
        run: |
          cd chawrt
          ls -lh bin/targets/x86/64/ || ls -lh bin/targets/*/*/ || true

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: chawrt-x86-64
          path: |
            chawrt/bin/targets/x86/64/*.img.gz
            chawrt/bin/targets/x86/64/*.img
            chawrt/bin/targets/x86/64/*.tar.gz
            chawrt/bin/targets/x86/64/*.vmdk
            chawrt/bin/targets/x86/64/*.manifest
          if-no-files-found: error
          retention-days: 7
