# chawrt x86 构建 v4 —— 官方 main 分支 + 仓库自带 x86.config
#
# 修订记录：
#   v1/v2  25.12 分支自拼配置 → 卡在 aw-bpf 源码仓库 404（该仓库不存在）
#   v3     改用官方 main + x86.config，但 swap 步骤在 runner 上撞到预置的 /swapfile
#          （fallocate: Text file busy）导致第一步就 fail
#   v4     修正：swap 全部容错；不再依赖 working-directory（目录不存在时后续步骤会连坐报错）
#
name: build chawrt x86 (official)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '源码分支（官方默认 main）'
        required: true
        default: 'main'
        type: string
      config:
        description: '使用仓库内哪份 .config'
        required: true
        default: 'x86.config'
        type: choice
        options: ['x86.config', 'r2s.config', '360t7.config', 'ea0326gmp.config', 'jcg.config', 'micr6608.config']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 腾磁盘 + swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          # runner 镜像自带 /swapfile，先看有没有，有就不再动它
          if ! sudo swapon --show 2>/dev/null | grep -q '/swapfile'; then
            sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 2>/dev/null || true
            sudo chmod 600 /swapfile 2>/dev/null || true
            sudo mkswap /swapfile >/dev/null 2>&1 || true
            sudo swapon /swapfile 2>/dev/null || true
          fi
          df -h /
          free -h
          exit 0

      - name: 装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time libelf-dev

      - name: 克隆 chawrt
        run: |
          git clone --depth 1 -b "${{ inputs.ref }}" https://github.com/liudf0716/chawrt.git chawrt
          cd chawrt
          echo "HEAD: $(git log -1 --format='%h %s')"
          ls -1 ./*.config | head -20

      - name: feeds
        run: |
          cd chawrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "feeds 完成"

      - name: 应用官方配置
        run: |
          cd chawrt
          cp "${{ inputs.config }}" .config
          make defconfig
          echo "==== target ===="
          grep -E '^CONFIG_TARGET_PROFILE|^CONFIG_TARGET_x86_64_DEVICE' .config || true
          echo "==== chawrt packages ===="
          grep -E '^CONFIG_PACKAGE_(apfree-wifidog|xfrpc|strongswan|bpfilter|luci-app-apfree-wifidog|luci-app-xfrpc)=' .config || true
          echo "==== 选中包数 ===="
          grep -c '^CONFIG_PACKAGE_.*=y$' .config || true

      - name: 下载源码
        continue-on-error: true
        run: |
          set -o pipefail
          cd chawrt
          make download -j8 2>&1 | tee download.log | tail -n 30
          echo "download 退出码: $?"

      - name: 编译
        run: |
          set -o pipefail
          cd chawrt
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: 编译失败定位
        if: failure()
        run: |
          cd chawrt || exit 0
          make -j1 V=s 2>&1 | tee build-single.log | tail -n 300 || true

      - name: 错误摘要
        if: failure()
        run: |
          [ -d chawrt ] || { echo "chawrt 目录不存在（克隆失败）"; exit 0; }
          cd chawrt
          for f in build.log build-single.log download.log; do
            [ -f "$f" ] || continue
            echo "===== $f errors ====="
            grep -nE 'make\[[0-9]+\]: \*\*\*|Error [0-9]+$|Killed|No space left|fatal error|ERROR:' "$f" | tail -n 50 || true
            echo "===== $f tail 80 ====="
            tail -n 80 "$f" || true
          done
          find logs -type f -name '*.txt' 2>/dev/null | head -30 || true
          df -h /

      - name: 上传诊断
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: diag-chawrt-x86
          path: |
            chawrt/build.log
            chawrt/build-single.log
            chawrt/download.log
            chawrt/.config
            chawrt/logs/**
          if-no-files-found: warn
          retention-days: 7

      - name: 产物清单
        if: success()
        run: |
          cd chawrt
          ls -lh bin/targets/x86/64/ || ls -lh bin/targets/*/*/ || true

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: chawrt-x86-64
          path: |
            chawrt/bin/targets/x86/64/*.img.gz
            chawrt/bin/targets/x86/64/*.img
            chawrt/bin/targets/x86/64/*.tar.gz
            chawrt/bin/targets/x86/64/*.vmdk
            chawrt/bin/targets/x86/64/*.manifest
          if-no-files-found: error
          retention-days: 7
