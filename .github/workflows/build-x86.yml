# chawrt x86 构建 v3 —— 用官方 main 分支的 x86.config（官方验证过的路径）
#
# v1/v2 在 25.12 分支自拼配置，卡在 aw-bpf 源码仓库 404（https://github.com/liudf0716/aw-bpf 不存在）。
# v3 直接克隆上游 liudf0716/chawrt 的 main 分支，用仓库自带的 x86.config（447 个包，
# 含 apfree-wifidog / xfrpc / strongswan / bpfilter / LuCI 全套中文），与官方
# liudf0716/action-chawrt/build_chawrt.sh 的做法一致：
#   git checkout main → cp x86.config .config → make oldconfig → make
#
name: build chawrt x86 (official)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '源码分支（官方默认 main）'
        required: true
        default: 'main'
        type: string
      config:
        description: '使用仓库内哪份 .config'
        required: true
        default: 'x86.config'
        type: choice
        options: ['x86.config', 'r2s.config', '360t7.config', 'ea0326gmp.config', 'jcg.config', 'micr6608.config']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 腾磁盘 + swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          df -h /
          free -h

      - name: 装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time libelf-dev

      - name: 克隆 chawrt
        run: |
          git clone --depth 1 -b "${{ inputs.ref }}" https://github.com/liudf0716/chawrt.git chawrt
          cd chawrt
          echo "HEAD: $(git log -1 --format='%h %s')"
          ls -1 ./*.config | head -20

      - name: feeds
        working-directory: chawrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用官方配置
        working-directory: chawrt
        run: |
          cp "${{ inputs.config }}" .config
          make defconfig
          echo "==== target ===="
          grep -E '^CONFIG_TARGET_(x86|PROFILE)|^CONFIG_TARGET_x86_64' .config || true
          echo "==== chawrt packages ===="
          grep -E '^CONFIG_PACKAGE_(apfree-wifidog|xfrpc|strongswan|bpfilter|luci-app-apfree-wifidog|luci-app-xfrpc)=' .config || true
          echo "==== count ===="
          grep -c '^CONFIG_PACKAGE_.*=y$' .config || true

      - name: 下载源码
        working-directory: chawrt
        continue-on-error: true
        run: |
          set -o pipefail
          make download -j8 2>&1 | tee download.log | tail -n 30

      - name: 编译
        working-directory: chawrt
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: 编译失败定位
        if: failure()
        working-directory: chawrt
        run: |
          make -j1 V=s 2>&1 | tee build-single.log | tail -n 300 || true

      - name: 错误摘要
        if: failure()
        working-directory: chawrt
        run: |
          for f in build.log build-single.log download.log; do
            [ -f "$f" ] || continue
            echo "===== $f errors ====="
            grep -nE 'make\[[0-9]+\]: \*\*\*|Error [0-9]+$|Killed|No space left|fatal error|ERROR:' "$f" | tail -n 50 || true
            echo "===== $f tail 80 ====="
            tail -n 80 "$f" || true
          done
          find logs -type f -name '*.txt' 2>/dev/null | head -30 || true
          df -h /

      - name: 上传诊断
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: diag-chawrt-x86
          path: |
            chawrt/build.log
            chawrt/build-single.log
            chawrt/download.log
            chawrt/.config
            chawrt/logs/**
          if-no-files-found: warn
          retention-days: 7

      - name: 产物清单
        if: success()
        working-directory: chawrt
        run: |
          ls -lh bin/targets/x86/64/ || ls -lh bin/targets/*/*/ || true

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: chawrt-x86-64
          path: |
            chawrt/bin/targets/x86/64/*.img.gz
            chawrt/bin/targets/x86/64/*.img
            chawrt/bin/targets/x86/64/*.tar.gz
            chawrt/bin/targets/x86/64/*.vmdk
            chawrt/bin/targets/x86/64/*.manifest
          if-no-files-found: error
          retention-days: 7
