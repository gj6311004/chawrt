# chawrt x86 构建（自包含版：一个文件搞定，配置内联，不需要额外 configs/ 目录）
#
# 用法：在 fork 仓库里新建 .github/workflows/build-x86.yml，粘贴本文件内容，Commit。
#       然后 Actions → "build chawrt x86" → Run workflow。
#
# profile:
#   base = 只保底（LuCI + dnsmasq-full + 基础网络），先确保能出镜像（约 60-120 分钟）
#   full = 追加 chawrt 定制（wifidog / xfrpc / strongswan / 流控），时间更长

name: build chawrt x86

on:
  workflow_dispatch:
    inputs:
      subtarget:
        description: 'x86 子目标'
        required: true
        default: '64'
        type: choice
        options: ['64', 'generic']
      profile:
        description: '配置档位'
        required: true
        default: 'base'
        type: choice
        options: ['base', 'full']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 腾磁盘
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time libelf-dev

      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=n
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_htop=y
          # CONFIG_PACKAGE_ppp is not set
          EOF

          # 32 位分支：换成 generic 子目标
          if [ "${{ inputs.subtarget }}" = "generic" ]; then
            sed -i 's#^CONFIG_TARGET_x86_64=y#CONFIG_TARGET_x86_generic=y#; s#^CONFIG_TARGET_x86_64_Generic=y#CONFIG_TARGET_x86_generic_Generic=y#' .config
            sed -i '/CONFIG_TARGET_x86_64_Generic/d' .config
          fi

          # full 档位：追加 chawrt 定制包（不存在的包会被 defconfig 丢弃，不会失败）
          if [ "${{ inputs.profile }}" = "full" ]; then
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_apfree-wifidog=y
          CONFIG_PACKAGE_xfrpc=y
          CONFIG_PACKAGE_strongswan=y
          CONFIG_PACKAGE_strongswan-swanctl=y
          CONFIG_PACKAGE_strongswan-mod-openssl=y
          CONFIG_PACKAGE_trafficshaper=y
          CONFIG_PACKAGE_tc-full=y
          CONFIG_KERNEL_BPF_SYSCALL=y
          CONFIG_KERNEL_NET_CLS_BPF=y
          CONFIG_KERNEL_NET_ACT_BPF=y
          EOF
          fi

          make defconfig
          echo "---- 关键项 ----"
          grep -E '^CONFIG_TARGET_(x86|PER_DEVICE)|^CONFIG_PACKAGE_(luci|xfrpc|apfree-wifidog)=' .config || true
          echo "---- 定制包是否可选中 ----"
          grep -E '^CONFIG_PACKAGE_(xfrpc|apfree-wifidog|strongswan)=' .config || echo "（本轮未选中定制包）"

      - name: 下载源码
        run: |
          make download -j8 || make download -j4 || true

      - name: 编译
        run: |
          set -o pipefail
          make -j"$(nproc)" || ( echo "=== 单线程重跑定位错误 ===" && make -j1 V=s )

      - name: 产物清单
        run: |
          echo "== x86/${{ inputs.subtarget}} =="
          ls -lh bin/targets/x86/${{ inputs.subtarget}}/ || true
          find bin/targets/x86 -maxdepth 2 -type f -name '*.img*' -printf '%10s  %p\n' || true

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: chawrt-x86-${{ inputs.subtarget }}-${{ inputs.profile }}
          path: |
            bin/targets/x86/${{ inputs.subtarget }}/*.img.gz
            bin/targets/x86/${{ inputs.subtarget }}/*.img
            bin/targets/x86/${{ inputs.subtarget }}/*.tar.gz
            bin/targets/x86/${{ inputs.subtarget }}/*.vmdk
            bin/targets/x86/${{ inputs.subtarget }}/*.manifest
          if-no-files-found: error
          retention-days: 7
